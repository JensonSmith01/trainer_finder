name: trainer_finder
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Core UI + Firebase
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.8

  # Google Maps & Location
  google_maps_flutter: ^2.12.2
  google_maps_flutter_web: ^0.5.12
  geolocator: ^14.0.1

  # Optional for future use; remove if not calling external APIs
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map_style.json
